{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="head"><h1>{{ title }}</h1></div>
<div class="panel formbox">
  {% if hint %}<p class="hint">{{ hint }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    {{ form.as_div }}
    <div class="actions"><button class="btn primary" type="submit">Save</button>
    <a class="btn ghost" href="{% url back %}">Cancel</a></div>
  </form>
</div>
{% endblock %}
